<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Карта агентов</title>
<link rel="stylesheet" href="leaflet/leaflet.css">
<style>
  html, body { margin: 0; height: 100%; background: #0e1319; overflow: hidden; font-family: "Segoe UI", sans-serif; }
  #map { position: absolute; inset: 0; background: #0e1319; }
  .leaflet-container { background: #0e1319; }
  .leaflet-control-zoom a { background: #1d2733; color: #c9d4df; border-color: #283340; }
  .leaflet-control-zoom a:hover { background: #243040; }
  .leaflet-control-layers { background: #1d2733; color: #e6edf3; border: 1px solid #283340; border-radius: 8px; }
  .leaflet-control-layers-toggle { background-color: #1d2733; border-radius: 8px; }
  .leaflet-control-layers-expanded { padding: 8px 12px; font-size: 12px; }
  .leaflet-control-attribution { background: rgba(14,19,25,0.7); color: #5b6772; font-size: 9px; }
  .leaflet-control-attribution a { color: #6b7c94; }
  .leaflet-tooltip { background: #1d2733; color: #e6edf3; border: 1px solid #283340; border-radius: 8px;
                     font-size: 12px; white-space: pre; box-shadow: none; }
  .leaflet-tooltip-top:before { border-top-color: #283340; }
  #legend { position: absolute; left: 12px; bottom: 24px; z-index: 500; color: #8a97a6; font-size: 11px;
            background: rgba(14,19,25,0.75); padding: 6px 10px; border-radius: 8px; border: 1px solid #283340; user-select: none; }
  #legend b { color: #e6edf3; font-weight: 600; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin: 0 5px 0 0; }
  #legend { max-width: calc(100% - 270px); line-height: 18px; }
  #legend .item { display: inline-block; white-space: nowrap; margin-left: 12px; }
  @media (max-width: 800px) {
    #legend { bottom: 58px; max-width: calc(100% - 24px); }
  }
  #buttons { position: absolute; right: 12px; bottom: 24px; z-index: 500; display: flex; gap: 6px; }
  #buttons div { background: #1d2733; color: #c9d4df; border: 1px solid #283340; border-radius: 8px; padding: 4px 10px;
                 font-size: 11px; cursor: pointer; user-select: none; }
  #buttons div.on { background: #24344d; color: #93c5fd; border-color: #3b82f6; }
  .agent-dot { border-radius: 50%; border: 2px solid #0e1319; box-shadow: 0 0 0 0 rgba(59,130,246,0.5); }
  .agent-dot.live { animation: pulse 2s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 var(--glow); } 70% { box-shadow: 0 0 0 12px rgba(0,0,0,0); } 100% { box-shadow: 0 0 0 0 rgba(0,0,0,0); } }
</style>
</head>
<body>
<div id="map"></div>
<div id="legend"><b id="count"></b>
  <span class="item"><span class="dot" style="background:#22c55e"></span>VPN работает</span>
  <span class="item"><span class="dot" style="background:#f59e0b"></span>часть узлов</span>
  <span class="item"><span class="dot" style="background:#ef4444"></span>VPN режут</span>
  <span class="item"><span class="dot" style="background:#93c5fd"></span>нет данных</span>
  <span class="item"><span class="dot" style="background:#5b6772"></span>молчит &gt; 12 ч</span>
</div>
<div id="buttons">
  <div id="btnRegions" class="on">Регионы</div>
  <div id="btnTiles" class="on">Подложка</div>
  <div id="btnHome">Россия</div>
</div>
<script src="leaflet/leaflet.js"></script>
<script>
const LANG = new URLSearchParams(location.search).get("lang") === "en" ? "en" : "ru";
const EN = { "VPN работает": "VPN works", "часть узлов": "some nodes", "VPN режут": "VPN blocked",
  "нет данных": "no data", "молчит > 12 ч": "silent > 12 h", "Регионы": "Regions", "Подложка": "Base map",
  "Россия": "Russia", "Тёмная": "Dark", "Улицы": "Streets", "Светлая": "Light", "Спутник": "Satellite",
  "Яндекс Карты не загрузились - нет интернета или ключ не принят": "Yandex Maps failed to load - no internet or the key was rejected" };
const tr = (s) => LANG === "en" ? (EN[s] || s) : s;
const ESC = { "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" };
const esc = (v) => String(v == null ? "" : v).replace(/[&<>"']/g, (c) => ESC[c]);
if (LANG === "en") {
  const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
  for (let node; (node = walker.nextNode());) {
    const text = node.nodeValue.trim();
    if (EN[text]) node.nodeValue = node.nodeValue.replace(text, EN[text]);
  }
}
const regionName = (p) => LANG === "en" ? (p.name || p.name_ru) : (p.name_ru || p.name);
const agentCount = (n) => LANG === "en" ? n + (n === 1 ? " agent" : " agents") : n + " " + plural(n, ["агент", "агента", "агентов"]);

const map = L.map("map", { zoomControl: true, worldCopyJump: true, minZoom: 2, maxZoom: 18, attributionControl: true })
  .setView([58, 60], 4);
const ESRI = "https://server.arcgisonline.com/ArcGIS/rest/services/";
const BASES = {
  [tr("Тёмная")]: L.tileLayer(ESRI + "Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}", { maxZoom: 16, attribution: "© Esri" }),
  [tr("Улицы")]: L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "© OpenStreetMap" }),
  [tr("Светлая")]: L.tileLayer(ESRI + "Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}", { maxZoom: 16, attribution: "© Esri" }),
  [tr("Спутник")]: L.tileLayer(ESRI + "World_Imagery/MapServer/tile/{z}/{y}/{x}", { maxZoom: 18, attribution: "© Esri" }),
};
const tiles = BASES[tr("Тёмная")].addTo(map);
L.control.layers(BASES, {}, { position: "topright", collapsed: true }).addTo(map);
let regionsLayer = null, regionsGeo = null, agents = [], markers = L.layerGroup().addTo(map);

function colorFor(a) {
  if (a.stale) return "#5b6772";
  if (!a.total) return "#93c5fd";
  if (a.alive === a.total) return "#22c55e";
  if (a.alive === 0) return "#ef4444";
  return "#f59e0b";
}

function inRing(pt, ring) {
  let inside = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const xi = ring[i][0], yi = ring[i][1], xj = ring[j][0], yj = ring[j][1];
    if (((yi > pt[1]) !== (yj > pt[1])) && (pt[0] < (xj - xi) * (pt[1] - yi) / (yj - yi) + xi)) inside = !inside;
  }
  return inside;
}
function inFeature(pt, f) {
  const g = f.geometry;
  const polys = g.type === "Polygon" ? [g.coordinates] : g.coordinates;
  for (const poly of polys) {
    if (inRing(pt, poly[0])) {
      let hole = false;
      for (let k = 1; k < poly.length; k++) if (inRing(pt, poly[k])) { hole = true; break; }
      if (!hole) return true;
    }
  }
  return false;
}

function regionStats() {
  const stats = new Map();
  if (!regionsGeo) return stats;
  for (const a of agents) {
    if (a.lat == null || a.lon == null || a.stale) continue;
    const f = regionsGeo.features.find(f => inFeature([a.lon, a.lat], f));
    if (!f) continue;
    const s = stats.get(f) || { agents: 0, alive: 0, total: 0, ops: new Set() };
    s.agents++; s.alive += a.alive || 0; s.total += a.total || 0; if (a.operator) s.ops.add(a.operator);
    stats.set(f, s);
  }
  return stats;
}

function styleRegions() {
  if (!regionsLayer) return;
  const stats = regionStats();
  regionsLayer.eachLayer(layer => {
    const s = stats.get(layer.feature);
    let fill = "#3b82f6", opacity = 0.05;
    if (s && s.total) {
      const ratio = s.alive / s.total;
      fill = ratio >= 0.8 ? "#22c55e" : ratio === 0 ? "#ef4444" : "#f59e0b";
      opacity = 0.35;
    } else if (s) { fill = "#93c5fd"; opacity = 0.25; }
    layer.setStyle({ fillColor: fill, fillOpacity: opacity, color: s ? fill : "#3b5a80", weight: s ? 1.5 : 0.7, opacity: s ? 0.9 : 0.5 });
    const name = regionName(layer.feature.properties);
    layer.bindTooltip(esc(s ? (LANG === "en" ? `${name}\nagents: ${s.agents} · alive ${s.alive} of ${s.total}\n${[...s.ops].join(", ")}`
      : `${name}\nагентов: ${s.agents} · живых ${s.alive} из ${s.total}\n${[...s.ops].join(", ")}`) : name),
      { sticky: true });
  });
}

function drawAgents() {
  markers.clearLayers();
  for (const a of agents) {
    if (a.lat == null || a.lon == null) continue;
    const c = colorFor(a);
    const lat = Number(a.lat), lon = Number(a.lon);
    if (!isFinite(lat) || !isFinite(lon)) continue;
    const icon = L.divIcon({ className: "", iconSize: [14, 14], iconAnchor: [7, 7],
      html: `<div class="agent-dot ${a.stale ? "" : "live"}" style="width:14px;height:14px;background:${c};--glow:${c}66"></div>` });
    L.marker([lat, lon], { icon }).bindTooltip(esc(a.tip || a.label), { direction: "top", offset: [0, -8] }).addTo(markers);
  }
  document.getElementById("count").textContent = agentCount(agents.length);
}
function plural(n, f) { const m = n % 10, h = n % 100; return f[(m === 1 && h !== 11) ? 0 : (m >= 2 && m <= 4 && (h < 10 || h >= 20)) ? 1 : 2]; }
document.getElementById("count").textContent = agentCount(0);

document.getElementById("btnHome").onclick = () => map.setView([58, 60], 4);
document.getElementById("btnTiles").onclick = (e) => {
  const shown = Object.values(BASES).some(l => map.hasLayer(l));
  if (shown) { Object.values(BASES).forEach(l => map.removeLayer(l)); e.target.classList.remove("on"); }
  else { BASES[tr("Тёмная")].addTo(map); e.target.classList.add("on"); }
};
document.getElementById("btnRegions").onclick = (e) => {
  if (!regionsLayer) return;
  if (map.hasLayer(regionsLayer)) { map.removeLayer(regionsLayer); e.target.classList.remove("on"); } else { regionsLayer.addTo(map); e.target.classList.add("on"); }
};

let worldLayer = null, worldShown = false;
window.setWorld = (geo) => {
  worldLayer = L.geoJSON(geo, { style: { color: "#2b3f5c", weight: 0.6, fillColor: "#14202f", fillOpacity: 0.6 }, interactive: false });
};
Object.values(BASES).forEach(l => l.on("tileerror", () => { if (worldLayer && !worldShown) { worldShown = true; worldLayer.addTo(map).bringToBack(); } }));
window.setRegions = (geo) => {
  regionsGeo = geo;
  if (regionsLayer) map.removeLayer(regionsLayer);
  regionsLayer = L.geoJSON(geo, { style: { color: "#3b5a80", weight: 0.7, fillOpacity: 0.05 } }).addTo(map);
  styleRegions();
};
window.setAgents = (list) => { agents = list; drawAgents(); styleRegions(); };
window.focusOn = (lon, lat, zoom) => { map.setView([lat, lon], zoom ? Math.max(6, Math.round(zoom + 3)) : 8); };
</script>
</body>
</html>
